  <!-- Set theme ASAP to avoid flash -->
  <script>
    (function () {
      try {
        const storedTheme = localStorage.getItem("sc-theme");
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        const theme = storedTheme || (prefersLight ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (err) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <!-- Global Styles -->
  <style>
    noise {

      left: 0;

      height: 100%;
      background: repeat center center url('/noise.svg');

    :root {
      --bg-base: #0c0f11;
      --bg-surface: rgba(0, 0, 0, 0.3);
      --bg-surface-alt: rgba(0, 0, 0, 0.2);
      --bg-surface-strong: rgba(0, 0, 0, 0.4);
      --text-strong: #f5f5f5;
      --text-default: #d1d5db;
      --text-muted: #9ca3af;

      --border-default: #4b5563;

      --accent-soft: rgba(8, 145, 178, 0.15);
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-alt: #f1f5f9;
      --bg-surface-strong: #e2e8f0;
      --text-strong: #0f172a;
      --text-default: #1f2937;
      --text-muted: #334155;
      --text-subtle: #475569;
      --border-default: #d0d7e2;
      --border-strong: #cbd5e1;
      --accent: #0ea5e9;
      --accent-strong: #0284c7;
      --accent-soft: rgba(14, 165, 233, 0.15);
      color-scheme: light;
    }

    html {
      background-color: var(--bg-base);
    }

    body {
      background: transparent;
      color: var(--text-muted);
    }

    .bg-background {
      background-color: var(--bg-base) !important;
    }

    .bg-black\/30 {
      background-color: var(--bg-surface) !important;
    }

    .bg-black\/20,
    .bg-gray-800\/30,
    .bg-gray-500\/10 {
      background-color: var(--bg-surface-alt) !important;
    }

    .bg-black\/40,
    .bg-black\/50 {
      background-color: var(--bg-surface-strong) !important;
    }

    .text-white,
    .text-primary {
      color: var(--text-strong) !important;
    }

    .text-gray-300 {
      color: var(--text-default) !important;
    }

    .text-gray-400 {
      color: var(--text-muted) !important;
    }

    .text-gray-500 {
      color: var(--text-subtle) !important;
    }

    .border-gray-600 {
      border-color: var(--border-default) !important;
    }

    .border-gray-700 {
      border-color: var(--border-strong) !important;
    }

    .bg-cyan-600 {
      background-color: var(--accent) !important;
    }

    .bg-cyan-700 {
      background-color: var(--accent-strong) !important;
    }

    .text-cyan-600,
    .text-cyan-300 {
      color: var(--accent) !important;
    }

    .text-cyan-400 {
      color: var(--accent-strong) !important;

    .bg-cyan-600\/20 {

  </style>

  <script>
    function onKonamiCode(cb) {
      var input = "";
      var key = "38384040373937396665";
      document.addEventListener("keydown", function (e) {
        input += "" + e.keyCode;
        if (input === key) {
          return cb();
        }
        if (!key.indexOf(input)) return;
        input = "" + e.keyCode;
      });
    }

    onKonamiCode(function () {
      window.location.href = "/happy.html";
    });
  </script>

<body class="xl:w-[55rem] lg:w-4/5 w-full md:px-4 mx-auto font-sans">

      <div class="mb-6 flex justify-end">

          href="./assets/cv/Stefan_Conradie_CV.pdf"

  <noise></noise>

  <script src="/js/theme.js"></script>
  <script type="module">
    import { getSummary, getContact, getWorkExperience, getProjects, getEducation, getSkills, getCertifications } from './js/cv.js';
    import { getFormattedDate } from './js/utils.js';

    async function renderCV() {
      console.log('Starting CV render...');
      const loadingMessage = document.getElementById('loading-message');
      if (loadingMessage) {
        loadingMessage.style.display = 'none';
      }
      
      try {
        // Render Contact Information
        const contactInfo = document.getElementById('contact-info');
        if (contactInfo) {
          const contact = await getContact();
          contactInfo.innerHTML = `
            <span>${contact.phone}</span>
            <span class="hidden sm:inline"> | </span>
            <a href="mailto:${contact.email}" class="text-cyan-600 hover:text-cyan-400 hover:underline">${contact.email}</a>
            <span class="hidden sm:inline"> | </span>
            <a href="https://${contact.linkedin}" target="_blank" rel="noopener noreferrer" class="text-cyan-600 hover:text-cyan-400 hover:underline">${contact.linkedin}</a>
          `;
        }

        // Render Summary
        const summaryText = document.getElementById('summary-text');
        if (summaryText) {
          const summary = await getSummary();
          summaryText.textContent = summary;
        }

        // Render Work Experience
        const workExpList = document.getElementById('work-experience-list');
        if (workExpList) {
          const workExp = await getWorkExperience();
          if (workExp.length === 0) {
            workExpList.innerHTML = '<li class="text-gray-400">No work experience available.</li>';
          } else {
            workExpList.innerHTML = workExp.map(exp => {
              const startDate = getFormattedDate(new Date(exp.startDate));
              const endDate = exp.endDate ? getFormattedDate(new Date(exp.endDate)) : 'Present';
              
              return `
                <li class="bg-black/30 border border-gray-600 rounded-lg p-4">
                  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between mb-2">
                    <div>
                      <h3 class="text-white font-semibold text-base">${exp.title}</h3>
                      <p class="text-cyan-600 text-sm">${exp.company}${exp.location ? ` • ${exp.location}` : ''}</p>
                    </div>
                    <time class="text-gray-400 text-sm mt-1 sm:mt-0">${startDate} – ${endDate}</time>
                  </div>
                  ${exp.responsibilities && exp.responsibilities.length > 0 ? `
                    <ul class="list-disc list-inside text-gray-400 text-sm mt-3 space-y-1">
                      ${exp.responsibilities.map(resp => `<li>${resp}</li>`).join('')}
                    </ul>
                  ` : ''}
                </li>
              `;
            }).join('');
          }
        }

        // Render Projects
        const projectsList = document.getElementById('projects-list');
        if (projectsList) {
          const projects = await getProjects();
          if (projects.length === 0) {
            projectsList.innerHTML = '<li class="text-gray-400">No projects available.</li>';
          } else {
            projectsList.innerHTML = projects.map(project => {
              return `
                <li class="bg-black/30 border border-gray-600 rounded-lg p-4">
                  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between mb-2">
                    <div>
                      <h3 class="text-white font-semibold text-base">${project.title}</h3>
                      <p class="text-cyan-600 text-sm">${project.technologies}</p>
                    </div>
                    <span class="text-gray-400 text-sm mt-1 sm:mt-0">${project.year}</span>
                  </div>
                  ${project.description ? `<p class="text-gray-300 text-sm mt-2">${project.description}</p>` : ''}
                </li>
              `;
            }).join('');
          }
        }

        // Render Education
        const educationList = document.getElementById('education-list');
        if (educationList) {
          const education = await getEducation();
          if (education.length === 0) {
            educationList.innerHTML = '<li class="text-gray-400">No education information available.</li>';
          } else {
            educationList.innerHTML = education.map(edu => {
              const startDate = getFormattedDate(new Date(edu.startDate));
              const endDate = edu.endDate ? getFormattedDate(new Date(edu.endDate)) : 'Present';
              
              return `
                <li class="bg-black/30 border border-gray-600 rounded-lg p-4">
                  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between mb-2">
                    <div>
                      <h3 class="text-white font-semibold text-base">${edu.degree}</h3>
                      <p class="text-cyan-600 text-sm">${edu.institution}${edu.location ? ` • ${edu.location}` : ''}</p>
                      ${edu.faculty ? `<p class="text-gray-400 text-xs mt-1">${edu.faculty}</p>` : ''}
                    </div>
                    <time class="text-gray-400 text-sm mt-1 sm:mt-0">${startDate} – ${endDate}</time>
                  </div>
                </li>
              `;
            }).join('');
          }
        }

        // Render Skills
        const skillsList = document.getElementById('skills-list');
        if (skillsList) {
          const skills = await getSkills();
          if (!skills || Object.keys(skills).length === 0) {
            skillsList.innerHTML = '<p class="text-gray-400">No skills information available.</p>';
          } else {
            const skillCategories = {
              programming: 'Programming',
              tools: 'Tools & Platforms',
              dataEngineering: 'Data Engineering',
              analytics: 'Analytics',
              aiAutomation: 'AI & Automation',
              businessIntelligence: 'Business Intelligence',
              projectManagement: 'Project Management'
            };

            skillsList.innerHTML = `
              <div class="bg-black/30 border border-gray-600 rounded-lg p-4 space-y-4">
                ${Object.entries(skills).map(([key, value]) => `
                  <div>
                    <h4 class="text-white font-semibold text-sm mb-2">${skillCategories[key] || key}</h4>
                    <div class="flex flex-wrap gap-2">
                      ${value.map(skill => `
                        <span class="px-3 py-1 bg-cyan-600/20 text-cyan-400 rounded text-sm border border-cyan-600/30">
                          ${skill}
                        </span>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          }
        }

        // Render Certifications
        const certificationsList = document.getElementById('certifications-list');
        if (certificationsList) {
          const certifications = await getCertifications();
          if (certifications.length === 0) {
            certificationsList.innerHTML = '<li class="text-gray-400">No certifications available.</li>';
          } else {
            certificationsList.innerHTML = certifications.map(cert => {
              const issueDate = getFormattedDate(new Date(cert.issueDate));
              return `
                <li class="bg-black/30 border border-gray-600 rounded-lg p-4">
                  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between">
                    <div>
                      <h3 class="text-white font-semibold text-base">${cert.name}</h3>
                      <p class="text-cyan-600 text-sm">${cert.issuer}</p>
                    </div>
                    <time class="text-gray-400 text-sm mt-1 sm:mt-0">Issued ${issueDate}</time>
                  </div>
                </li>
              `;
            }).join('');
          }
        }
      } catch (error) {
        console.error('Error loading CV:', error);
        // Show error message on page
        const cvContainer = document.getElementById('cv-container');
        const loadingMessage = document.getElementById('loading-message');
        if (loadingMessage) {
          loadingMessage.style.display = 'none';
        }
        if (cvContainer) {
          cvContainer.innerHTML = `
            <div class="bg-red-500/10 border border-red-500/30 rounded-lg p-4">
              <p class="text-red-400 font-semibold mb-2">⚠️ Error loading CV data</p>
              <p class="text-gray-400 text-sm mb-2">${error.message}</p>
              <p class="text-gray-400 text-xs mb-3">ES6 modules require a web server. Please run:</p>
              <div class="bg-black/50 border border-gray-600 rounded p-3 font-mono text-xs">
                <code class="text-cyan-400">npm run dev</code>
              </div>
              <p class="text-gray-400 text-xs mt-3">Then open <code class="text-cyan-400">http://localhost:3000/cv.html</code> in your browser</p>
            </div>
          `;
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM loaded, rendering CV...');
      renderCV();
      
      // Set active nav item
      const currentPath = window.location.pathname;
      if (currentPath === '/cv.html' || currentPath.endsWith('cv.html')) {
        document.getElementById('cv')?.classList.add('text-white', 'opacity-100');
        document.getElementById('cv')?.classList.remove('text-gray-400', 'opacity-70');
        document.getElementById('home')?.classList.remove('text-white', 'opacity-100');
        document.getElementById('home')?.classList.add('text-gray-400', 'opacity-70');
      }
    });
  </script>
